<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Great Bay Financial | Liquidity. Growth. Freedom.</title>
  <link rel="icon" type="image/svg+xml" href="/great-bay-favicon.svg" />

  <!-- The hero's first frame. Without this it is not requested until React has
       mounted and created the video element, which leaves the viewport bare
       navy for the length of the bundle download. Preloading it here starts the
       fetch during HTML parse instead, so the hero is painted before the loop
       has anything to hand over from. -->
  <link rel="preload" as="image" href="/great-bay-loop-poster.webp" fetchpriority="high" />
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Syne:wght@400;500;700;800&display=swap"
    rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
            display: ['Syne', 'sans-serif'],
          },
          boxShadow: {
            /* Focus doubles the thickness of a field's rule on top of turning
               it accent, so the indicator does not rest on colour alone. Named
               here rather than written inline: the Play CDN's class scanner
               does not pick up an arbitrary shadow containing a hex literal,
               so `shadow-[0_1px_0_0_#E8DEC9]` silently emits nothing. */
            field: '0 1px 0 0 #E8DEC9',
            'field-box': '0 0 0 1px #E8DEC9',
          },
          colors: {
            background: '#0A1628', // Dark Navy
            surface: '#1A3D5D',     // Lighter Slate Blue
            accent: '#E8DEC9',      // Custom Gold/Beige
            cream: '#E8DDC8',       // Off-White/Parchment
            white: '#F1EBDD',
            muted: '#94a3b8',       // Blue-grey text
          },
          animation: {
            'spin-slow': 'spin 12s linear infinite',
            'marquee': 'marquee 25s linear infinite',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            marquee: {
              '0%': { transform: 'translateX(0%)' },
              '100%': { transform: 'translateX(-100%)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)', filter: 'blur(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)', filter: 'blur(0px)' },
            },
            width: {
              '0%': { width: '0' },
              '100%': { width: '100%' },
            },
            scrollDownLine: {
              '0%': { transform: 'translateY(-100%)' },
              '100%': { transform: 'translateY(100%)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0A1628;
      color: #E8DDC8;
      overflow-x: hidden;
      /* Light type on a dark ground renders heavy by default; grayscale
         smoothing keeps the cream text from blooming into the navy. */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* One focus treatment for the whole site. The UA default outline is
       near-invisible against #0A1628. */
    :focus-visible {
      outline: 1px solid #E8DEC9;
      outline-offset: 3px;
    }

    /* Content is visible by default; motion is an enhancement on top of it. */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      /* The hero words and CTA start at opacity-0 and are revealed by an
         animation. With animations suppressed they must not stay invisible. */
      [class*="animate-[fadeIn"] {
        opacity: 1 !important;
        filter: none !important;
        transform: none !important;
      }
    }

    /* Smooth Scrolling handled by JS below */

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0A1628;
    }

    ::-webkit-scrollbar-thumb {
      background: #1A3D5D;
      border-radius: 4px;
      border: 1px solid #0A1628;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #E8DEC9;
    }

    /* Selection */
    ::selection {
      background-color: #E8DEC9;
      color: #0A1628;
    }

    /* Utilities */
    .text-outline {
      -webkit-text-stroke: 1px rgba(232, 221, 200, 0.3);
      color: transparent;
    }

    .text-outline-accent {
      -webkit-text-stroke: 1px #E8DEC9;
      color: transparent;
    }

  </style>

</head>

<body>
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="name" />
    <input type="text" name="company" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <textarea name="message"></textarea>
    <input type="checkbox" name="marketing_opt_in" value="agreed" />
    <input type="text" name="bot-field" />
  </form>

  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>

  <script>
    // Custom smooth scroll with easeInOutCubic easing
    function smoothScrollTo(targetY, duration) {
      const startY = window.scrollY;
      const distance = targetY - startY;
      let startTime = null;

      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);
        window.scrollTo(0, startY + distance * easeInOutCubic(progress));
        if (progress < 1) requestAnimationFrame(step);
      }

      requestAnimationFrame(step);
    }

    document.addEventListener('click', function (e) {
      const link = e.target.closest('a[href^="#"]');
      if (!link) return;
      const id = link.getAttribute('href').slice(1);
      const target = document.getElementById(id);
      if (!target) return;
      e.preventDefault();
      const targetY = target.getBoundingClientRect().top + window.scrollY;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        window.scrollTo(0, targetY);
        return;
      }
      smoothScrollTo(targetY, 1200);
    });
  </script>
</body>

</html>
